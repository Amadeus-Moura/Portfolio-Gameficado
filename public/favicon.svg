<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00558f"/>
    </linearGradient>
    <linearGradient id="guard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Crossed Swords (SAO Style) -->
  <!-- Sword 1 (from top-left to bottom-right) -->
  <g transform="rotate(45 32 32)">
    <!-- Blade -->
    <path d="M30 8 L32 4 L34 8 L34 40 L30 40 Z" fill="url(#blade)"/>
    <!-- Blade center fuller -->
    <line x1="32" y1="8" x2="32" y2="38" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>
    <!-- Guard -->
    <path d="M22 40 L42 40 L40 43 L24 43 Z" fill="url(#guard)"/>
    <circle cx="32" cy="41.5" r="2" fill="#ffffff"/>
    <!-- Grip -->
    <rect x="30.5" y="43" width="3" height="11" rx="1" fill="#1e293b"/>
    <!-- Pommel -->
    <circle cx="32" cy="56" r="3" fill="#00d2ff"/>
  </g>

  <!-- Sword 2 (from top-right to bottom-left) -->
  <g transform="rotate(-45 32 32)">
    <!-- Blade -->
    <path d="M30 8 L32 4 L34 8 L34 40 L30 40 Z" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Blade center fuller -->
    <line x1="32" y1="8" x2="32" y2="38" stroke="#00d2ff" stroke-width="1"/>
    <!-- Guard -->
    <path d="M22 40 L42 40 L40 43 L24 43 Z" fill="url(#guard)"/>
    <circle cx="32" cy="41.5" r="2" fill="#38bdf8"/>
    <!-- Grip -->
    <rect x="30.5" y="43" width="3" height="11" rx="1" fill="#0f172a"/>
    <!-- Pommel -->
    <circle cx="32" cy="56" r="3" fill="#ffffff"/>
  </g>
</svg>